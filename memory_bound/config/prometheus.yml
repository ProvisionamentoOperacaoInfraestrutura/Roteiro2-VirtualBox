global:
  scrape_interval: 2s
  scrape_timeout: 2s

scrape_configs:
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8084']
        labels:
          group: 'meu-spring-boot'
          application: 'memory_bound'

  - job_name: 'locust'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['locust:8089']
        labels:
          application: 'memory_bound'
