version: '3.8'

networks:
  aw-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:


services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    networks:
      - aw-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - app
    networks:
      - aw-network
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:latest
    networks:
      - aw-network
    ports:
      - "3000:3000"
