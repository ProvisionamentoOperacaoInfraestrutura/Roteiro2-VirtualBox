networks:
  aw-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:


services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8084"
    networks:
      - aw-network

  locust:
    image: virtualbox-locust:2.46.0
    build:
      context: ../observability
      dockerfile: locust.Dockerfile
    command:
      - -f
      - /mnt/locust/locustfile.py
      - --host
      - http://app:8084
      - --web-host
      - 0.0.0.0
      - --web-port
      - "8089"
    environment:
      PYTHONPATH: /mnt/locust
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
      - ../observability:/mnt/locust/observability:ro
    depends_on:
      - app
    networks:
      - aw-network
    ports:
      - "8090:8089"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - app
      - locust
    networks:
      - aw-network
    ports:
      - "9092:9090"
  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana:/etc/grafana/provisioning/locust-dashboards:ro
    depends_on:
      - prometheus
    networks:
      - aw-network
    ports:
      - "3002:3000"




  logger:
    image: docker:cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/dados:/logs
    depends_on:
      - app
      - locust
      - prometheus
      - grafana
    networks:
      - aw-network
    command:
      - sh
      - -c
      - |
        PROJECT=$$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' $$(hostname))
        for s in app locust prometheus grafana; do
          (
            SINCE=0
            while true; do
              ID=$$(docker ps -q --filter "label=com.docker.compose.project=$$PROJECT" --filter "label=com.docker.compose.service=$$s")
              if [ -n "$$ID" ]; then
                docker logs -f --timestamps --since "$$SINCE" "$$ID" 2>&1 | while IFS= read -r line; do
                  echo "[$$s] $$line" >> /logs/io.log
                done
                SINCE=$$(date +%s)
              fi
              sleep 2
            done
          ) &
        done
        wait